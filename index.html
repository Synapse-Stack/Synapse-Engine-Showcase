<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Synapse Engine — Benchmark Results</title>
        <style>
            :root {
                --bg: #0d1117;
                --surface: #161b22;
                --surface2: #1c2128;
                --border: #30363d;
                --text: #e6edf3;
                --muted: #8b949e;
                --accent: #2f81f7;
                --green: #3fb950;
                --yellow: #d29922;
                --red: #f85149;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                background: var(--bg);
                color: var(--text);
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                line-height: 1.5;
            }
            a {
                color: var(--accent);
                text-decoration: none;
            }
            a:hover {
                text-decoration: underline;
            }
            code {
                font-family: "SF Mono", "Cascadia Code", monospace;
                font-size: 11px;
                background: var(--surface2);
                padding: 2px 6px;
                border-radius: 4px;
                color: var(--muted);
            }

            .wrap {
                max-width: 1160px;
                margin: 0 auto;
                padding: 0 24px;
            }

            /* ── Header ── */
            header {
                border-bottom: 1px solid var(--border);
                padding: 20px 0 18px;
            }
            .header-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 12px;
            }
            .logo h1 {
                font-size: 18px;
                font-weight: 600;
            }
            .logo p {
                font-size: 12px;
                color: var(--muted);
                margin-top: 2px;
            }

            .badge {
                display: inline-flex;
                align-items: center;
                gap: 7px;
                padding: 5px 13px;
                border-radius: 20px;
                font-size: 12px;
                font-weight: 500;
                border: 1px solid;
            }
            .badge .dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: currentColor;
            }
            .badge.green {
                color: var(--green);
                border-color: rgba(63, 185, 80, 0.3);
                background: rgba(63, 185, 80, 0.07);
            }
            .badge.yellow {
                color: var(--yellow);
                border-color: rgba(210, 153, 34, 0.3);
                background: rgba(210, 153, 34, 0.07);
            }
            .badge.red {
                color: var(--red);
                border-color: rgba(248, 81, 73, 0.3);
                background: rgba(248, 81, 73, 0.07);
            }
            .badge.muted {
                color: var(--muted);
                border-color: var(--border);
                background: transparent;
            }

            /* ── Run meta strip ── */
            .run-meta {
                display: flex;
                flex-wrap: wrap;
                gap: 16px;
                font-size: 12px;
                color: var(--muted);
                padding: 14px 0 0;
            }

            /* ── Metric cards ── */
            .metrics {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
                gap: 14px;
                margin: 28px 0;
            }
            .mcard {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 18px 20px;
            }
            .mcard-label {
                font-size: 11px;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.06em;
                margin-bottom: 6px;
            }
            .mcard-value {
                font-size: 26px;
                font-weight: 600;
                font-variant-numeric: tabular-nums;
                line-height: 1.2;
            }
            .mcard-sub {
                font-size: 11px;
                color: var(--muted);
                margin-top: 3px;
            }
            .green {
                color: var(--green);
            }
            .yellow {
                color: var(--yellow);
            }
            .red {
                color: var(--red);
            }
            .accent {
                color: var(--accent);
            }

            /* ── Section headers ── */
            .section-head {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                margin-bottom: 14px;
            }
            .section-head h2 {
                font-size: 15px;
                font-weight: 600;
            }
            .section-head span {
                font-size: 12px;
                color: var(--muted);
            }

            /* ── Corpus grid ── */
            .corpus-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
                gap: 10px;
                margin-bottom: 36px;
            }
            .ccard {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 14px 18px;
                transition: border-color 0.15s;
            }
            .ccard:hover {
                border-color: #484f58;
            }
            .ccard-head {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 9px;
            }
            .ccard-name {
                font-size: 13px;
                font-weight: 500;
            }
            .ccard-acc {
                font-size: 13px;
                font-weight: 600;
                font-variant-numeric: tabular-nums;
            }
            .bar-bg {
                height: 3px;
                background: var(--border);
                border-radius: 2px;
                overflow: hidden;
                margin-bottom: 9px;
            }
            .bar-fill {
                height: 100%;
                border-radius: 2px;
                transition: width 0.7s ease;
            }
            .ccard-stats {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
                font-size: 11px;
                color: var(--muted);
            }
            .ccard-stats span {
                color: var(--text);
            }

            /* ── History table ── */
            .table-wrap {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                overflow: hidden;
                margin-bottom: 40px;
                overflow-x: auto;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                font-size: 13px;
                min-width: 560px;
            }
            thead th {
                padding: 10px 14px;
                text-align: left;
                font-size: 11px;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.05em;
                border-bottom: 1px solid var(--border);
                background: var(--surface2);
                font-weight: 500;
            }
            tbody tr {
                border-bottom: 1px solid var(--border);
            }
            tbody tr:last-child {
                border-bottom: none;
            }
            tbody tr:hover {
                background: var(--surface2);
            }
            td {
                padding: 10px 14px;
            }
            .tag {
                display: inline-block;
                padding: 2px 8px;
                border-radius: 10px;
                font-size: 11px;
                font-weight: 500;
            }
            .tag.green {
                background: rgba(63, 185, 80, 0.15);
                color: var(--green);
            }
            .tag.red {
                background: rgba(248, 81, 73, 0.15);
                color: var(--red);
            }

            /* ── Empty / loading ── */
            .empty {
                text-align: center;
                padding: 56px 24px;
                color: var(--muted);
            }
            .empty h3 {
                font-size: 15px;
                color: var(--text);
                margin-bottom: 6px;
            }

            footer {
                border-top: 1px solid var(--border);
                padding: 20px 0;
                text-align: center;
                font-size: 11px;
                color: var(--muted);
            }

            @media (max-width: 600px) {
                .metrics {
                    grid-template-columns: 1fr 1fr;
                }
                .header-row {
                    flex-direction: column;
                    align-items: flex-start;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <div class="wrap">
                <div class="header-row">
                    <div class="logo">
                        <h1>⚡ Synapse Watermarking Engine</h1>
                        <p>Automated regression benchmark — live results</p>
                    </div>
                    <div id="status-badge" class="badge muted">
                        <div class="dot"></div>
                        <span>Loading…</span>
                    </div>
                </div>
                <div class="run-meta" id="run-meta"></div>
            </div>
        </header>

        <main class="wrap">
            <div class="metrics" id="metrics"></div>

            <div class="section-head">
                <h2>Corpus Results</h2>
                <span id="corpus-count"></span>
            </div>
            <div class="corpus-grid" id="corpus-grid"></div>

            <div class="section-head">
                <h2>Run History</h2>
                <span id="history-count"></span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Workflow</th>
                            <th>Branch</th>
                            <th>Accuracy</th>
                            <th>PDFs</th>
                            <th>Result</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <tr>
                            <td
                                colspan="6"
                                style="
                                    text-align: center;
                                    color: var(--muted);
                                    padding: 32px;
                                "
                            >
                                Loading…
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <footer>
            <div class="wrap">
                Synapse Engine Showcase · Auto-updated by CI ·
                <a href="https://github.com/Synapse-Stack/synapse-corpus-core"
                    >synapse-corpus-core</a
                >
            </div>
        </footer>

        <script>
            const color = (r) =>
                r >= 95 ? "green" : r >= 80 ? "yellow" : "red";
            const barClr = (r) =>
                r >= 95
                    ? "var(--green)"
                    : r >= 80
                      ? "var(--yellow)"
                      : "var(--red)";
            const label = (r) =>
                r >= 95
                    ? "🟢 Excellent"
                    : r >= 80
                      ? "🟡 Warning"
                      : "🔴 Critical";

            function fmt(iso) {
                if (!iso) return "—";
                return new Date(iso).toLocaleString("en-US", {
                    month: "short",
                    day: "numeric",
                    year: "numeric",
                    hour: "2-digit",
                    minute: "2-digit",
                    timeZoneName: "short",
                });
            }

            function shortWf(name) {
                return (name || "")
                    .replace("Regression Suite - ", "")
                    .replace("Smoke Test - ", "");
            }

            async function load() {
                let latest = null,
                    history = [];
                try {
                    const r = await fetch("data/latest.json?t=" + Date.now());
                    if (r.ok) latest = await r.json();
                } catch {}
                try {
                    const r = await fetch("data/history.json?t=" + Date.now());
                    if (r.ok) history = await r.json();
                } catch {}
                render(latest, history);
            }

            function render(d, history) {
                const badge = document.getElementById("status-badge");

                if (!d) {
                    badge.className = "badge muted";
                    badge.innerHTML =
                        '<div class="dot"></div><span>No data yet</span>';
                    document.getElementById("run-meta").innerHTML =
                        "<span>Waiting for the first run to complete.</span>";
                    renderMetrics(null);
                    renderCorpora([]);
                    renderHistory([]);
                    return;
                }

                const c = color(d.overall_accuracy);
                badge.className = `badge ${c}`;
                badge.innerHTML = `<div class="dot"></div><span>${label(d.overall_accuracy)}</span>`;

                document.getElementById("run-meta").innerHTML = [
                    `Run <code>#${d.run_id}</code>`,
                    fmt(d.generated_at),
                    `Branch <code>${d.branch}</code>`,
                    `Commit <code>${(d.commit_sha || "").slice(0, 7)}</code>`,
                    shortWf(d.workflow_name),
                ]
                    .map((s) => `<span>${s}</span>`)
                    .join("");

                renderMetrics(d);
                renderCorpora(d.corpora || []);
                renderHistory(history);
            }

            function renderMetrics(d) {
                const el = document.getElementById("metrics");
                if (!d) {
                    el.innerHTML = [
                        "Overall Accuracy",
                        "PDFs Tested",
                        "Passed",
                        "Failed / Timeout",
                    ]
                        .map(
                            (l) =>
                                `<div class="mcard"><div class="mcard-label">${l}</div><div class="mcard-value" style="color:var(--muted)">—</div></div>`,
                        )
                        .join("");
                    return;
                }
                const totalFail = (d.corpora || []).reduce(
                    (s, c) => s + (c.fail || 0) + (c.fake_pass || 0),
                    0,
                );
                const totalTout = (d.corpora || []).reduce(
                    (s, c) => s + (c.timeout || 0),
                    0,
                );
                const c = color(d.overall_accuracy);
                el.innerHTML = `
      <div class="mcard">
        <div class="mcard-label">Overall Accuracy</div>
        <div class="mcard-value ${c}">${d.overall_accuracy.toFixed(2)}%</div>
        <div class="mcard-sub">${(d.corpora || []).length} corpora this run</div>
      </div>
      <div class="mcard">
        <div class="mcard-label">PDFs Tested</div>
        <div class="mcard-value accent">${(d.total_pdfs || 0).toLocaleString()}</div>
        <div class="mcard-sub">this run</div>
      </div>
      <div class="mcard">
        <div class="mcard-label">Passed</div>
        <div class="mcard-value green">${(d.total_pass || 0).toLocaleString()}</div>
        <div class="mcard-sub">watermarks verified</div>
      </div>
      <div class="mcard">
        <div class="mcard-label">Failed / Timeout</div>
        <div class="mcard-value ${totalFail + totalTout > 0 ? "red" : "green"}">${totalFail} / ${totalTout}</div>
        <div class="mcard-sub">violations + timeouts</div>
      </div>`;
            }

            function renderCorpora(corpora) {
                const el = document.getElementById("corpus-grid");
                const cnt = document.getElementById("corpus-count");
                if (!corpora.length) {
                    el.innerHTML = `<div class="empty"><h3>No corpus data yet</h3><p>Results appear after the first run.</p></div>`;
                    cnt.textContent = "";
                    return;
                }
                const sorted = [...corpora].sort(
                    (a, b) => b.accuracy - a.accuracy,
                );
                cnt.textContent = `${sorted.length} corpora`;
                el.innerHTML = sorted
                    .map(
                        (c) => `
      <div class="ccard">
        <div class="ccard-head">
          <span class="ccard-name">${c.name}</span>
          <span class="ccard-acc ${color(c.accuracy)}">${c.accuracy.toFixed(2)}%</span>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${c.accuracy}%;background:${barClr(c.accuracy)}"></div></div>
        <div class="ccard-stats">
          <span>✅ <span>${c.pass}</span></span>
          ${c.fail > 0 ? `<span>❌ <span>${c.fail}</span></span>` : ""}
          ${c.fake_pass > 0 ? `<span>⚠️ <span>${c.fake_pass}</span></span>` : ""}
          ${c.timeout > 0 ? `<span>⏱ <span>${c.timeout}</span></span>` : ""}
          <span style="margin-left:auto">${c.total} files</span>
        </div>
      </div>`,
                    )
                    .join("");
            }

            function renderHistory(history) {
                const tbody = document.getElementById("history-body");
                const cnt = document.getElementById("history-count");
                if (!history.length) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:32px">No history yet.</td></tr>`;
                    cnt.textContent = "";
                    return;
                }
                cnt.textContent = `${history.length} runs`;
                const c = (r) => color(r.overall_accuracy || 0);
                tbody.innerHTML = history
                    .map(
                        (r) => `
      <tr>
        <td>${fmt(r.timestamp)}</td>
        <td>${shortWf(r.workflow_name)}</td>
        <td><code>${r.branch || "—"}</code></td>
        <td><span style="color:var(--${c(r)});font-weight:600">${(r.overall_accuracy || 0).toFixed(2)}%</span></td>
        <td>${(r.total_pdfs || 0).toLocaleString()}</td>
        <td><span class="tag ${r.conclusion === "success" ? "green" : "red"}">${r.conclusion || "—"}</span></td>
      </tr>`,
                    )
                    .join("");
            }

            load();
        </script>
    </body>
</html>
